<div class="pill-notificacion" *ngIf="notificacion">{{ notificacion }}</div>

<header class="content-header">
  <div>
    <h1>Departamentos</h1>
    <p>Estructura organizativa · <strong>Principal33</strong></p>
  </div>
  <button class="btn-primary" (click)="mostrarFormulario = true" *ngIf="!mostrarFormulario">
    <i class="fas fa-plus"></i> Nuevo Departamento
  </button>
</header>

<section class="inventory-card mb-4" *ngIf="mostrarFormulario">
  <h4 class="form-title">{{ modoEdicion ? 'Editar Departamento' : 'Nuevo Departamento' }}</h4>
  <form (ngSubmit)="guardar()" class="form-flex-row">

    <div class="field-group flex-2">
      <label>Nombre *</label>
      <input [(ngModel)]="nuevo.nombre" name="nombre"
             placeholder="Desarrollo, RRHH, Finanzas..." class="form-input" required />
    </div>

    <div class="field-group flex-1">
      <label>Sede</label>
      <select [(ngModel)]="nuevo.sede" name="sede" class="form-input">
        <option *ngFor="let s of sedes" [value]="s">{{ s }}</option>
      </select>
    </div>

    <button type="submit" class="btn-primary">
      <i class="fas fa-save"></i> {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
    </button>
    <button type="button" class="btn-secondary" (click)="reset()">Cancelar</button>
  </form>
</section>

<div class="dept-grid" *ngIf="departamentos.length > 0; else sinDept">
  <div class="dept-card" *ngFor="let d of departamentos">
    <div class="dept-icon"><i class="fas fa-building"></i></div>
    <div class="dept-info">
      <h3>{{ d.nombre }}</h3>
      <div class="dept-meta">
        <span [class]="'sede-badge ' + sedeBadge(d.sede)">{{ d.sede }}</span>
        <span class="emp-count">
          <i class="fas fa-users"></i> {{ d.totalEmpleados }} empleado(s)
        </span>
      </div>
    </div>
    <div class="dept-acciones">
      <button class="btn-icon btn-edit" (click)="prepararEdicion(d)"><i class="fas fa-edit"></i></button>
      <button class="btn-icon btn-delete" (click)="eliminar(d.id!)"><i class="fas fa-trash"></i></button>
    </div>
  </div>
</div>

<ng-template #sinDept>
  <div class="empty-state">
    <i class="fas fa-building fa-2x"></i>
    <p>No hay departamentos creados aún.</p>
  </div>
</ng-template>
